apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adv-postgres
  namespace: adv-protect
spec:
  serviceName: "adv-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: adv-postgres
  template:
    metadata:
      labels:
        app: adv-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "${POSTGRES_USER}"
            - name: POSTGRES_PASSWORD
              value: "${POSTGRES_PASSWORD}"
            - name: POSTGRES_DB
              value: "${POSTGRES_DB}"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
