version: '3.8'
services:
  worker_gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker.gpu
    image: avp/worker:gpu
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
